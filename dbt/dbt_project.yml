name: adh
version: "1.0.0"
profile: adh

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
seed-paths: ["seeds"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

vars:
  # Identifies the operating company on every row. A second company would get its own
  # staging models with its own company_id, feeding the same intermediate and mart models.
  company_id: "hvac_nc"

  # Part 2 opportunity model (see docs/OPPORTUNITY_SPEC.md for the reasoning behind each value)
  opp_behind_pct: 0.10              # behind this year = same-period GP at least this far below last year
  opp_quiet_gap_multiple: 4         # gone quiet = silent for more than this multiple of their normal gap
  opp_rhythm_min_invoices: 5        # purchase invoices needed for a reliable buying rhythm
  opp_min_lost_gp: 1000             # flag only if estimated lost gross profit is at least this
  opp_min_brand_gp: 1000            # "stopped buying a brand" if the brand was worth at least this
  opp_sharp_drop_pct: 0.25          # sharp drop = latest complete year at least this far below BOTH earlier years
  opp_weight_early_warning: 1.0     # winnability weights by opportunity type
  opp_weight_declining: 0.7
  opp_weight_recovering: 0.4

models:
  adh:
    staging:
      +schema: staging
      # Tables, not views: every cast runs at build time, so a bad value fails here
      # instead of in whichever later layer first reads that column.
      +materialized: table
    intermediate:
      +schema: intermediate
      +materialized: table
    marts:
      +schema: marts
      +materialized: table

seeds:
  adh:
    +schema: seeds
