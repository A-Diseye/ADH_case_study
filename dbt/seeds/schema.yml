version: 2

seeds:
  - name: salesperson_system_accounts
    description: Salesperson IDs that are system / house accounts, not real salespeople. Judgement call, reviewable.
    columns:
      - name: salesperson_id
        data_tests: [unique, not_null]
  - name: buyline_map
    description: >
      Buy-line near-duplicate review. confidence = high (applied), likely / uncertain (not applied),
      distinct (looks similar but is a different line).
    columns:
      - name: buy_line
        data_tests: [unique, not_null]
      - name: confidence
        data_tests:
          - accepted_values:
              arguments: {values: [high, likely, uncertain, distinct]}
  - name: customer_groups
    description: >
      Related bill-to accounts that are one customer (ADH confirmed): account -> the account that
      represents the group (largest gross profit, or the customer master's own link). Reviewable.
    config:
      column_types: {customer_id: varchar, group_customer_id: varchar}
    columns:
      - name: customer_id
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments: {to: ref('stg_customers'), field: customer_id}
      - name: group_customer_id
        data_tests:
          - not_null
          - relationships:
              arguments: {to: ref('stg_customers'), field: customer_id}
